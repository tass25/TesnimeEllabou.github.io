name: Build and Deploy Vite React App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Vite App
        run: npm run build

      - name: Deploy to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages-temp
          cp -r dist/* .
          git add .
          git commit -m "Deploy first build"
          git push -f origin gh-pages-temp

      - name: Merge to main
        run: |
          git fetch origin main
          git checkout main
          git merge gh-pages-temp --allow-unrelated-histories -m "First deploy from Actions"
          git push origin main
